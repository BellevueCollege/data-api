trigger: none
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: BellevueCollege/bc-laravel-devops-templates
      endpoint: github-service-connection
      ref: refs/heads/trunk

  pipelines:
    - pipeline: ci
      source: data-api
      trigger:
        branches:
          include:
            - 'refs/tags/v*'

extends:
  template: templates/release/laravel-release.yml@templates
  parameters:
    appName: 'data-api'
    githubRepo: 'data-api'

    cacheRoutes: false

    serverAppRoot: '/var/www/nonpub/data-api'
    serverPublicRoot: '/var/www/html/data'
    serverTempRoot: '/var/www/nonpub/TEMP'
    serverBackupPath: '/var/www/nonpub/backups/data-api'

    productionEnvironments:
      - name: ApacheProdC
        displayName: 'Apache: Production'
        environment: ApacheProd-C
        variableGroup: 'Data API Prod'
