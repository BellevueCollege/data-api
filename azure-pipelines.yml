trigger:
  branches:
    include:
      - trunk
  tags:
    include:
      - 'v*'
  paths:
    exclude:
      - azure-pipelines.yml
      - azure-pipelines-release.yml

pr:
  drafts: false
  branches:
    include:
      - '*'

resources:
  repositories:
    - repository: templates
      type: github
      name: BellevueCollege/bc-laravel-devops-templates
      endpoint: github-service-connection
      ref: refs/heads/trunk

extends:
  template: templates/ci/laravel-ci.yml@templates
  parameters:
    appName: 'data-api'

    runTests: true
    testJobTimeoutInMinutes: 120

    phpVersion: '8.3'
    runNpm: false
    cacheRoutes: false
    cacheBootstrapOnDeploy: false

    serverAppRoot: '/var/www/nonpub/dataapi'
    serverPublicRoot: '/var/www/html/aproot/data'
    serverTempRoot: '/var/www/nonpub/TEMP'
    serverBackupPath: '/var/www/nonpub/backups/dataapi'

    testEnvironments:
      - name: ApacheTestC
        displayName: 'Apache: Test'
        environment: ApacheTest-C
        variableGroup: 'Data API Test'

    testSetupSteps:
      - checkout: self
        clean: true

      - task: Cache@2
        displayName: Cache Composer packages
        inputs:
          key: 'composer | "$(Agent.OS)" | composer.lock'
          restoreKeys: |
            composer | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.composer-cache

      - task: Cache@2
        displayName: Cache Docker build layers
        inputs:
          key: 'docker | "$(Agent.OS)" | docker/8.3/Dockerfile'
          restoreKeys: |
            docker | "$(Agent.OS)"
          path: $(Pipeline.Workspace)/.docker-build-cache

      - script: |
          sudo update-alternatives --set php /usr/bin/php8.3
          sudo update-alternatives --set phar /usr/bin/phar8.3
          sudo update-alternatives --set phpdbg /usr/bin/phpdbg8.3
          sudo update-alternatives --set php-cgi /usr/bin/php-cgi8.3
          sudo update-alternatives --set phar.phar /usr/bin/phar.phar8.3
          php -version
        displayName: Use PHP version 8.3

      - script: |
          set -euo pipefail
          mkdir -p "$(Pipeline.Workspace)/.composer-cache"
          composer install --prefer-dist --no-interaction --no-progress
        displayName: Composer install (with dev dependencies)
        env:
          COMPOSER_CACHE_DIR: $(Pipeline.Workspace)/.composer-cache
          APP_KEY: base64:2fl+KtvkphFZ9A2m9m5xL3+8zgQpD6vH8jK4nM1pQ0s=

      - script: |
          set -euo pipefail
          docker info
          export APP_SERVICE="data-api.test"
          export WWWUSER="$(id -u)"
          export WWWGROUP="$(id -g)"
          export COMPOSE_PROJECT_NAME="dataapi$(Build.BuildId)"
          export DOCKER_BUILDKIT=1
          CACHE_DIR="$(Pipeline.Workspace)/.docker-build-cache"
          mkdir -p "$CACHE_DIR"
          if ! docker buildx inspect ado-sail-builder >/dev/null 2>&1; then
            docker buildx create --name ado-sail-builder --use
          else
            docker buildx use ado-sail-builder
          fi
          CACHE_FROM_ARGS=()
          if [ -n "$(ls -A "$CACHE_DIR" 2>/dev/null)" ]; then
            CACHE_FROM_ARGS=(--cache-from "type=local,src=$CACHE_DIR")
          fi
          docker buildx build \
            --load \
            "${CACHE_FROM_ARGS[@]}" \
            --cache-to "type=local,dest=$CACHE_DIR,mode=max" \
            --build-arg "WWWGROUP=$(id -g)" \
            -t sail-8.3/app \
            -f docker/8.3/Dockerfile \
            docker/8.3
          ./vendor/bin/sail up -d --no-build
          ./vendor/bin/sail artisan --version
        displayName: Sail build and start

      - script: |
          set -euo pipefail
          mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache test-results
          if [ ! -f .env ]; then cp .env.example .env; fi
          touch database/testing.sqlite
          chmod u+rwX database storage bootstrap/cache
          chmod u+rw database/testing.sqlite
        displayName: Prepare writable test directories

    testSteps:
      - script: |
          set -euo pipefail
          export APP_SERVICE="data-api.test"
          export WWWUSER="$(id -u)"
          export WWWGROUP="$(id -g)"
          export COMPOSE_PROJECT_NAME="dataapi$(Build.BuildId)"
          mkdir -p test-results
          set +e
          ./vendor/bin/sail artisan test --compact --do-not-cache-result --log-junit /tmp/junit.xml
          TEST_EXIT=$?
          set -e
          if ./vendor/bin/sail exec -T data-api.test test -f /tmp/junit.xml; then
            ./vendor/bin/sail exec -T data-api.test cat /tmp/junit.xml > test-results/junit.xml
          fi
          exit $TEST_EXIT
        displayName: Run PHPUnit via Sail

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '**/junit.xml'
          mergeTestResults: true
          failTaskOnFailedTests: true

      - script: |
          export APP_SERVICE="data-api.test"
          export WWWUSER="$(id -u)"
          export WWWGROUP="$(id -g)"
          export COMPOSE_PROJECT_NAME="dataapi$(Build.BuildId)"
          ./vendor/bin/sail down --remove-orphans
        displayName: Sail down
        condition: always()
