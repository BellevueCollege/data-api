name: data-api

trigger:
  branches:
    include:
      - master
  tags:
    include:
      - 'v*'
  paths:
    exclude:
      - azure-pipelines.yml

pr:
  drafts: false
  branches:
    include:
      - '*'
  paths:
    include:
      - '**'

variables:
  phpVersion: 8.3
  appService: data-api.test
  wwwUser: 1000

jobs:
- job: Test
  displayName: Test (Sail)
  pool:
    vmImage: ubuntu-24.04
  variables:
    composeProjectName: dataapi$(Build.BuildId)
  steps:
  - checkout: self
    clean: true

  - task: Cache@2
    displayName: Cache Composer packages
    inputs:
      key: 'composer | "$(Agent.OS)" | composer.lock'
      restoreKeys: |
        composer | "$(Agent.OS)"
      path: $(HOME)/.composer/cache

  - task: Cache@2
    displayName: Cache Docker build layers
    inputs:
      key: 'docker | "$(Agent.OS)" | docker/8.3/Dockerfile'
      restoreKeys: |
        docker | "$(Agent.OS)"
      path: $(Pipeline.Workspace)/.docker-build-cache

  - script: |
      sudo update-alternatives --set php /usr/bin/php$(phpVersion)
      sudo update-alternatives --set phar /usr/bin/phar$(phpVersion)
      sudo update-alternatives --set phpdbg /usr/bin/phpdbg$(phpVersion)
      sudo update-alternatives --set php-cgi /usr/bin/php-cgi$(phpVersion)
      sudo update-alternatives --set phar.phar /usr/bin/phar.phar$(phpVersion)
      php -version
    displayName: Use PHP version $(phpVersion)

  - script: composer install --prefer-dist --no-interaction --no-progress
    displayName: Composer install (with dev dependencies)
    env:
      APP_KEY: base64:2fl+KtvkphFZ9A2m9m5xL3+8zgQpD6vH8jK4nM1pQ0s=

  - script: |
      set -euo pipefail
      docker info
      export APP_SERVICE="$(appService)"
      export WWWUSER="$(wwwUser)"
      export WWWGROUP=`id -g`
      export COMPOSE_PROJECT_NAME="$(composeProjectName)"
      export DOCKER_BUILDKIT=1
      CACHE_DIR="$(Pipeline.Workspace)/.docker-build-cache"
      mkdir -p "$CACHE_DIR"
      if ! docker buildx inspect ado-sail-builder >/dev/null 2>&1; then
        docker buildx create --name ado-sail-builder --use
      else
        docker buildx use ado-sail-builder
      fi
      CACHE_FROM_ARGS=()
      if [ -n "$(ls -A "$CACHE_DIR" 2>/dev/null)" ]; then
        CACHE_FROM_ARGS=(--cache-from "type=local,src=$CACHE_DIR")
      fi
      docker buildx build \
        --load \
        "${CACHE_FROM_ARGS[@]}" \
        --cache-to "type=local,dest=$CACHE_DIR,mode=max" \
        --build-arg "WWWGROUP=$(id -g)" \
        -t sail-8.3/app \
        -f docker/8.3/Dockerfile \
        docker/8.3
      ./vendor/bin/sail up -d --no-build
      ./vendor/bin/sail artisan --version
    displayName: Sail build and start

  - script: |
      set -euo pipefail
      export APP_SERVICE="$(appService)"
      export WWWUSER="$(wwwUser)"
      export WWWGROUP=`id -g`
      export COMPOSE_PROJECT_NAME="$(composeProjectName)"
      mkdir -p test-results
      set +e
      ./vendor/bin/sail artisan test --compact --do-not-cache-result --log-junit /tmp/junit.xml
      TEST_EXIT=$?
      set -e
      ./vendor/bin/sail exec -T "$(appService)" cat /tmp/junit.xml > test-results/junit.xml
      exit $TEST_EXIT
    displayName: Run PHPUnit via Sail

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/junit.xml'
      mergeTestResults: true
      failTaskOnFailedTests: true

  - script: |
      export APP_SERVICE="$(appService)"
      export WWWUSER="$(wwwUser)"
      export WWWGROUP=`id -g`
      export COMPOSE_PROJECT_NAME="$(composeProjectName)"
      ./vendor/bin/sail down --remove-orphans
    displayName: Sail down
    condition: always()

- job: Build
  displayName: Build release artifact
  dependsOn: Test
  condition: succeeded()
  pool:
    vmImage: ubuntu-24.04
  steps:
  - checkout: self
    clean: true

  - script: |
      sudo update-alternatives --set php /usr/bin/php$(phpVersion)
      sudo update-alternatives --set phar /usr/bin/phar$(phpVersion)
      sudo update-alternatives --set phpdbg /usr/bin/phpdbg$(phpVersion)
      sudo update-alternatives --set php-cgi /usr/bin/php-cgi$(phpVersion)
      sudo update-alternatives --set phar.phar /usr/bin/phar.phar$(phpVersion)
      php -version
    displayName: Use PHP version $(phpVersion)

  - script: composer install --optimize-autoloader --no-dev
    displayName: Composer install

  - task: PublishPipelineArtifact@1
    displayName: Publish pipeline artifact
    inputs:
      targetPath: '$(Pipeline.Workspace)'
      artifact: 'data-api'
      publishLocation: 'pipeline'
