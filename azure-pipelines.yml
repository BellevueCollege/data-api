trigger:
  branches:
    include:
      - trunk
  tags:
    include:
      - 'v*'
  paths:
    exclude:
      - azure-pipelines.yml
      - azure-pipelines-release.yml

pr:
  drafts: false
  branches:
    include:
      - '*'

resources:
  repositories:
    - repository: templates
      type: github
      name: BellevueCollege/bc-laravel-devops-templates
      endpoint: github-service-connection
      ref: refs/heads/trunk

extends:
  template: templates/ci/laravel-ci.yml@templates
  parameters:
    appName: 'data-api'

    runTests: false

    phpVersion: '8.3'
    runNpm: false
    cacheRoutes: false

    serverAppRoot: '/var/www/nonpub/dataapi'
    serverPublicRoot: '/var/www/html/aproot/data'
    serverTempRoot: '/var/www/nonpub/TEMP'
    serverBackupPath: '/var/www/nonpub/backups/dataapi'

    testEnvironments:
      - name: ApacheTestC
        displayName: 'Apache: Test'
        environment: ApacheTest-C
        variableGroup: 'Data API Test'
